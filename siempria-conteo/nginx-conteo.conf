server {
    listen 443 ssl;
    server_name conteo.siempriapp.com;

    ssl_certificate /etc/letsencrypt/live/siempriapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siempriapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend - serve built static files
    root /opt/siempria-conteo/frontend/build;
    index index.html;

    # API proxy to backend on port 8002
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback - serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name conteo.siempriapp.com;
    return 301 https://$host$request_uri;
}
