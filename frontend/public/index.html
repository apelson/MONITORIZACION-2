<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#00a3d9" />
        <meta name="description" content="Siempria Network Monitor - Sistema de Monitorización de Red" />
        
        <!-- PWA Meta Tags -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Siempria Monitor" />
        <meta name="application-name" content="Siempria Monitor" />
        <meta name="msapplication-TileColor" content="#00a3d9" />
        <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
        
        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />
        
        <!-- Icons -->
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
        <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />
        
        <!-- Splash Screens for iOS -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        
        <title>Siempria Network Monitor</title>
        
        <!-- Register Service Worker -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(function(registration) {
                            console.log('Siempria PWA: Service Worker registrado', registration.scope);
                        })
                        .catch(function(error) {
                            console.log('Siempria PWA: Error al registrar Service Worker', error);
                        });
                });
            }
        </script>
    </head>
    <body>
        <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
        <div id="root"></div>
    </body>
</html>
