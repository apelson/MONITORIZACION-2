<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#00AEEF" />
        <meta name="description" content="WatchTower by Siempria - Sistema de Monitorización de Red y Cámaras de Seguridad" />
        
        <!-- PWA Meta Tags -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="WatchTower" />
        <meta name="application-name" content="WatchTower" />
        <meta name="msapplication-TileColor" content="#00AEEF" />
        <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
        
        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />
        
        <!-- Icons - Siempria Brand -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
        <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />
        
        <!-- Splash Screens for iOS -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        
        <title>WatchTower by Siempria</title>
        
        <!-- Register Service Worker -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js')
                        .then(function(registration) {
                            console.log('Siempria PWA: Service Worker registrado', registration.scope);
                        })
                        .catch(function(error) {
                            console.log('Siempria PWA: Error al registrar Service Worker', error);
                        });
                });
            }
        </script>
    </head>
    <body>
        <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
        <div id="root"></div>
    </body>
</html>
